<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="circle.ico" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbstractBlade</title>
  </head>
  <body>
    <div id="app">
      <div id="arena">
        <div id="cornerTopLeft" class="corner">
          <div id="cornerLabelTopLeft" class="cornerLabel">1</div>
        </div>
        <div id="cornerTopRight" class="corner">
          <div id="cornerLabelTopRight" class="cornerLabel">1</div>
        </div>
        <div id="cornerBottomLeft" class="corner">
          <div id="cornerLabelBottomLeft" class="cornerLabel">1</div>
        </div>
        <div id="cornerBottomRight" class="corner">
          <div id="cornerLabelBottomRight" class="cornerLabel">1</div>
        </div>
      </div>
      <div id="joystick">
        <div id="joystickBase"><div id="joystickKnob"></div></div>
      </div>
    </div>
    <div id="menu">
      <div id="menuTitle">ABSTRACT BLADE</div>
      <div id="continueButton" class="menuButton">Continue</div>
      <div id="newGameButton" class="menuButton">New Game</div>
    </div>
    <div id="loading">
      <div id="loadingText">Loading...</div>
      <div id="loadingTrack"><div id="loadingBar"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
